<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, sans-serif; overflow: hidden; }
    #stage { position: relative; width: 100%; min-height: 280px; overflow: hidden; border-radius: 12px; background: #0a1222; touch-action: none; user-select: none; }
    #videoFrame { display: block; width: 100%; height: 100%; object-fit: contain; background: #050914; pointer-events: auto; }
    .blur { position: absolute; border: 2px dashed rgba(255,255,255,.72); background: rgba(9,16,30,.12); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 3px; touch-action: none; cursor: move; }
    .blur::after { content: ''; position: absolute; right: -8px; bottom: -8px; width: 15px; height: 15px; border-radius: 50%; background: #ffd166; border: 2px solid #112; cursor: nwse-resize; }
    #subtitle { position: absolute; max-width: 88%; padding: 3px 7px; border: 2px dashed #ffd166; border-radius: 4px; color: #ffd166; font-weight: 800; text-align: center; text-shadow: 2px 2px 2px #000,-2px -2px 2px #000; touch-action: none; cursor: move; white-space: pre-wrap; line-height: 1.22; }
  </style>
</head>
<body>
  <div id="stage"><video id="videoFrame" muted controls playsinline preload="metadata"></video></div>
  <script>
    const stage = document.getElementById('stage');
    const videoFrame = document.getElementById('videoFrame');
    let args = {}, active = null, lastValue = '', renderedScene = '', renderedRefresh = '', renderedSubtitlePosition = '', mounted = false, mountTicket = 0, loadedFontUrl = '', activeFontFamily = '', fontRevision = 0;
    const send = (type, data = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, '*');
    const size = () => send('streamlit:setFrameHeight', { height: Math.max(180, Math.ceil(stage.getBoundingClientRect().height)) });
    const ready = () => send('streamlit:componentReady', { apiVersion: 1 });
    const clamp = (v, low, high) => Math.max(low, Math.min(high, v));
    function visibleVideoRect() {
      const stageWidth = Math.max(1, stage.clientWidth), stageHeight = Math.max(1, stage.clientHeight);
      const sourceWidth = Math.max(1, Number(args.source_width || args.width || 1)), sourceHeight = Math.max(1, Number(args.source_height || args.height || 1));
      const scale = Math.min(stageWidth / sourceWidth, stageHeight / sourceHeight);
      const width = sourceWidth * scale, height = sourceHeight * scale;
      return { left: (stageWidth - width) / 2, top: (stageHeight - height) / 2, width, height };
    }
    function stageBounds() { return { left: 0, top: 0, width: Math.max(1, stage.clientWidth), height: Math.max(1, stage.clientHeight) }; }
    function serialize(notify = true) {
      const width = Number(args.source_width || args.width || 1), height = Number(args.source_height || args.height || 1);
      const videoRect = visibleVideoRect();
      const masks = [...stage.querySelectorAll('.blur')].map(el => ({
        x: Math.round((Number(el.dataset.x || 0) - videoRect.left) * width / videoRect.width),
        y: Math.round((Number(el.dataset.y || 0) - videoRect.top) * height / videoRect.height),
        width: Math.round(Number(el.dataset.w || 1) * width / videoRect.width),
        height: Math.round(Number(el.dataset.h || 1) * height / videoRect.height),
      }));
      const subtitle = document.getElementById('subtitle');
      const result = { blur_masks: masks, subtitle: subtitle ? { x: Math.round((Number(subtitle.dataset.x || 0) + subtitle.offsetWidth / 2) * 100 / stage.clientWidth), y: Math.round((Number(subtitle.dataset.y || 0) + subtitle.offsetHeight / 2) * 100 / stage.clientHeight) } : null };
      const encoded = JSON.stringify(result);
      if (encoded !== lastValue) { lastValue = encoded; if (notify) send('streamlit:setComponentValue', { value: result, dataType: 'json' }); }
    }
    function draftKey() { return `one-team-overlay-draft:${String(args.persist_key || args.scene_key || '')}`; }
    function readDraft() {
      try { return JSON.parse(sessionStorage.getItem(draftKey()) || 'null'); } catch (_) { return null; }
    }
    function writeDraft() {
      if (!args.persist_key && !args.scene_key) return;
      const width = Math.max(1, stage.clientWidth), height = Math.max(1, stage.clientHeight);
      const videoRect = visibleVideoRect();
      const blur_masks = [...stage.querySelectorAll('.blur')].map(el => ({ x: (Number(el.dataset.x || 0) - videoRect.left) / videoRect.width, y: (Number(el.dataset.y || 0) - videoRect.top) / videoRect.height, width: Number(el.dataset.w || 1) / videoRect.width, height: Number(el.dataset.h || 1) / videoRect.height }));
      const subtitle = document.getElementById('subtitle');
      const subtitle_draft = subtitle ? { x: Number(subtitle.dataset.x || 0) / width, y: Number(subtitle.dataset.y || 0) / height } : null;
      try { sessionStorage.setItem(draftKey(), JSON.stringify({ blur_masks, subtitle: subtitle_draft })); } catch (_) {}
    }
    function mountDrag(el, mode) {
      el.addEventListener('pointerdown', event => { event.preventDefault(); el.setPointerCapture(event.pointerId); const rect = el.getBoundingClientRect(), bounds = mode === 'blur' ? visibleVideoRect() : stageBounds(); active = { el, mode: mode === 'blur' && event.offsetX > el.clientWidth - 28 && event.offsetY > el.clientHeight - 28 ? 'resize' : 'move', startX: event.clientX, startY: event.clientY, x: Number(el.dataset.x || 0), y: Number(el.dataset.y || 0), w: Number(el.dataset.w || rect.width), h: Number(el.dataset.h || rect.height), bounds }; });
      el.addEventListener('pointermove', event => { if (!active || active.el !== el) return; const dx = event.clientX - active.startX, dy = event.clientY - active.startY, bounds = active.bounds; if (active.mode === 'resize') { el.dataset.w = clamp(active.w + dx, 24, bounds.left + bounds.width - active.x); el.dataset.h = clamp(active.h + dy, 24, bounds.top + bounds.height - active.y); } else { el.dataset.x = clamp(active.x + dx, bounds.left, bounds.left + bounds.width - el.offsetWidth); el.dataset.y = clamp(active.y + dy, bounds.top, bounds.top + bounds.height - el.offsetHeight); } apply(el); writeDraft(); });
      const finish = () => { if (active && active.el === el) { active = null; writeDraft(); serialize(); } };
      el.addEventListener('pointerup', finish);
      el.addEventListener('pointercancel', finish);
      el.addEventListener('lostpointercapture', finish);
    }
    function apply(el) { el.style.left = `${el.dataset.x}px`; el.style.top = `${el.dataset.y}px`; if (el.dataset.w) el.style.width = `${el.dataset.w}px`; if (el.dataset.h) el.style.height = `${el.dataset.h}px`; }
    function blur(mask, index, draft = null) { const rect = visibleVideoRect(), sx = rect.width / Number(args.source_width || args.width || 1), sy = rect.height / Number(args.source_height || args.height || 1); const el = document.createElement('div'); el.className = 'blur'; el.dataset.x = draft ? clamp(rect.left + Number(draft.x || 0) * rect.width, rect.left, rect.left + rect.width - 24) : rect.left + Number(mask.x || 0) * sx; el.dataset.y = draft ? clamp(rect.top + Number(draft.y || 0) * rect.height, rect.top, rect.top + rect.height - 24) : rect.top + Number(mask.y || 0) * sy; el.dataset.w = draft ? clamp(Number(draft.width || 0.1) * rect.width, 24, rect.left + rect.width - Number(el.dataset.x)) : Math.max(24, Number(mask.width || 1) * sx); el.dataset.h = draft ? clamp(Number(draft.height || 0.1) * rect.height, 24, rect.top + rect.height - Number(el.dataset.y)) : Math.max(24, Number(mask.height || 1) * sy); apply(el); mountDrag(el, 'blur'); stage.appendChild(el); }
    function installMyanmarFont(dataUrl) { if (!dataUrl) return activeFontFamily; if (dataUrl === loadedFontUrl) return activeFontFamily; let style = document.getElementById('one-team-subtitle-font'); if (!style) { style = document.createElement('style'); style.id = 'one-team-subtitle-font'; document.head.appendChild(style); } loadedFontUrl = dataUrl; activeFontFamily = `OneTeamMyanmar${++fontRevision}`; style.textContent = `@font-face{font-family:'${activeFontFamily}';src:url('${dataUrl}') format('truetype');font-display:block;}`; return activeFontFamily; }
    function subtitle(data, draft = null) { const embeddedFont = installMyanmarFont(data.font_data_url || ''); const el = document.createElement('div'); el.id = 'subtitle'; el.textContent = data.text || 'စာတန်းထိုး နေရာ'; el.style.color = data.color || '#FFD166'; el.style.fontFamily = `${embeddedFont || data.font || 'Noto Sans Myanmar'}, sans-serif`; el.style.fontSize = `${clamp(Number(data.render_size || data.size || 30) * stage.clientWidth / Number(data.reference_width || 720), 14, 48)}px`; stage.appendChild(el); const x = draft ? Number(draft.x || 0) * stage.clientWidth + el.offsetWidth / 2 : Number(data.x || 50) * stage.clientWidth / 100; const y = draft ? Number(draft.y || 0) * stage.clientHeight + el.offsetHeight / 2 : Number(data.y || 78) * stage.clientHeight / 100; el.dataset.x = clamp(x - el.offsetWidth / 2, 0, stage.clientWidth - el.offsetWidth); el.dataset.y = clamp(y - el.offsetHeight / 2, 0, stage.clientHeight - el.offsetHeight); renderedSubtitlePosition = `${Number(data.x || 50)}:${Number(data.y || 78)}`; apply(el); mountDrag(el, 'subtitle'); }
    function syncSubtitleAppearance() {
      const el = document.getElementById('subtitle');
      if (!el || !args.subtitle) return;
      const data = args.subtitle;
      el.textContent = data.text || 'စာတန်းထိုး နေရာ';
      el.style.color = data.color || '#FFD166';
      const embeddedFont = installMyanmarFont(data.font_data_url || '');
      el.style.fontFamily = `${embeddedFont || data.font || 'Noto Sans Myanmar'}, sans-serif`;
      const scaledSize = Number(data.render_size || data.size || 30) * stage.clientWidth / Number(data.reference_width || 720);
      el.style.fontSize = `${clamp(scaledSize, 14, 48)}px`;
      const positionKey = `${Number(data.x || 50)}:${Number(data.y || 78)}`;
      if (positionKey !== renderedSubtitlePosition) { el.dataset.x = clamp(Number(data.x || 50) * stage.clientWidth / 100 - el.offsetWidth / 2, 0, stage.clientWidth - el.offsetWidth); el.dataset.y = clamp(Number(data.y || 78) * stage.clientHeight / 100 - el.offsetHeight / 2, 0, stage.clientHeight - el.offsetHeight); renderedSubtitlePosition = positionKey; apply(el); }
    }
    function mountOverlays(ticket) { if (ticket !== mountTicket) return; stage.querySelectorAll('.blur,#subtitle').forEach(el => el.remove()); const draft = readDraft() || {}; if (args.blur_enabled) (args.blur_masks || []).forEach((mask, index) => blur(mask, index, (draft.blur_masks || [])[index])); if (args.subtitle_enabled) subtitle(args.subtitle || {}, draft.subtitle); mounted = true; size(); serialize(false); }
    function render(next) {
      const incoming = next || {};
      const scene = String(incoming.scene_key || '');
      const refresh = String(incoming.refresh_token || '0');
      const sourceChanged = String(incoming.video || '') !== String(videoFrame.dataset.editorSource || '');
      const needsRemount = !mounted || scene !== renderedScene || refresh !== renderedRefresh;
      args = incoming;
      if (!needsRemount) { syncSubtitleAppearance(); size(); return; }
      renderedScene = scene;
      renderedRefresh = refresh;
      stage.style.width = '100%';
      stage.style.height = 'auto';
      stage.style.aspectRatio = `${args.width || 9} / ${args.height || 16}`;
      const ticket = ++mountTicket;
      if (sourceChanged) { videoFrame.onloadedmetadata = () => mountOverlays(ticket); videoFrame.dataset.editorSource = args.video || ''; videoFrame.src = args.video || ''; videoFrame.load(); if (videoFrame.readyState >= 1) requestAnimationFrame(() => mountOverlays(ticket)); }
      else { requestAnimationFrame(() => mountOverlays(ticket)); }
    }
    window.addEventListener('message', event => { if (event.data && event.data.type === 'streamlit:render') render(event.data.args || {}); });
    ready();
  </script>
</body>
</html>
